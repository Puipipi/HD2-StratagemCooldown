<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>战备冷却 / Stratagem Cooldown - 配置生成器</title>
<style>
 body{font-family:system-ui,Segoe UI,Microsoft YaHei,sans-serif;background:#12161c;color:#e6e9ef;margin:0;padding:24px}
 h1{font-size:20px;margin:0 0 4px} .sub{color:#8b94a3;font-size:13px;margin-bottom:18px}
 .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;max-width:1100px}
 .card{background:#1b2129;border:1px solid #2a323d;border-radius:10px;padding:14px}
 .card h2{font-size:14px;margin:0 0 10px;color:#9fd0ff}
 label{display:block;margin:6px 0;font-size:14px;cursor:pointer}
 textarea{width:100%%;height:210px;margin-top:18px;background:#0e1218;color:#cfe8ff;border:1px solid #2a323d;
          border-radius:8px;padding:12px;font-family:Consolas,monospace;font-size:13px}
 button{margin-top:10px;background:#2f6fed;color:#fff;border:0;border-radius:8px;padding:10px 16px;font-size:14px;cursor:pointer}
 .ok{color:#5ad07a;margin-left:10px;font-size:13px}
</style></head><body>
<h1>战备冷却 / Stratagem Cooldown — 配置生成器</h1>
<div class="sub">勾选后复制生成的文本，粘贴到 <code>%%LOCALAPPDATA%%\CowboyBingus\Helldivers2\VehicleCooldown\config.txt</code>，重启游戏生效。</div>
<div class="grid">
  <div class="card"><h2>冷却时间 / Cooldown</h2>
    <label>冷却保留百分比（10-100）：<input id="cdnum" type="number" min="10" max="100" step="5" value="80"></label>
  </div>
  <div class="card"><h2>红战备 / Red</h2>
    <label><input type="radio" name="red" value="off" checked> 关闭（默认）</label>
    <label><input type="radio" name="red" value="both"> 轨道 + 飞鹰</label>
    <label><input type="radio" name="red" value="orbital"> 只轨道</label>
    <label><input type="radio" name="red" value="eagle"> 只飞鹰</label>
  </div>
  <div class="card"><h2>蓝战备 / Blue</h2>
    <label><input type="radio" name="blue" value="vehicles" checked> 就载具（默认）</label>
    <label><input type="radio" name="blue" value="mechs"> 就机甲</label>
    <label><input type="radio" name="blue" value="both"> 就载具和机甲</label>
    <label><input type="radio" name="blue" value="all"> 全部（支援+载具+机甲）</label>
    <label><input type="radio" name="blue" value="off"> 关闭</label>
  </div>
  <div class="card"><h2>绿战备 / Green</h2>
    <label><input type="radio" name="green" value="off" checked> 关闭（默认）</label>
    <label><input type="radio" name="green" value="on"> 开启（哨戒/炮台/地雷/特斯拉/护盾）</label>
  </div>
  <div class="card"><h2>次数增加 / Charges</h2>
    <label>次数增加（0-20）：<input id="chnum" type="number" min="0" max="20" step="1" value="0"></label>
    <label><input type="checkbox" id="chunl"> 取消次数上限（写 -1）</label>
    <div class="sub">机甲、轨道激光等；飞鹰不受此项影响。</div>
  </div>
  <div class="card"><h2>飞鹰次数 / Eagle charges</h2>
    <label>飞鹰次数增加（0-20）：<input id="egnum" type="number" min="0" max="20" step="1" value="0"></label>
    <div class="sub">飞鹰不要设“无限”（会显示不可用）。</div>
  </div>
</div>
<textarea id="out" readonly></textarea>
<button onclick="cp()">复制 / Copy</button><span id="msg" class="ok"></span>
<script>
function val(n){return document.querySelector('input[name="'+n+'"]:checked').value;}
function num(id,lo,hi,dflt){var v=parseInt(document.getElementById(id).value,10);
  if(isNaN(v))v=dflt; if(v<lo)v=lo; if(v>hi)v=hi; return v;}
function gen(){
  var cd=num('cdnum',10,100,80), red=val('red'), blue=val('blue'), green=val('green');
  var chadd=num('chnum',0,20,0), chunl=document.getElementById('chunl').checked;
  var egadd=num('egnum',0,20,0);
  var L=[]; L.push('; 战备冷却 / Stratagem Cooldown - generated by config-builder.html');
  L.push('cooldown=yes'); L.push('percent='+cd);
  if(red==='off'){ L.push('red=no'); }
  else if(red==='orbital'){ L.push('red=yes'); L.push('eagle=no'); }
  else if(red==='eagle'){ L.push('red=yes'); L.push('orbital=no'); }
  else { L.push('red=yes'); }
  var scopes=['vehicles','mechs','both','all'];
  if(scopes.indexOf(blue)<0){ L.push('blue=no'); }
  else { L.push('blue=yes'); L.push('blue_scope='+blue); }
  L.push('green='+(green==='on'?'yes':'no'));
  L.push('uses_add='+(chunl?0:chadd));
  L.push('uses_unlimited='+(chunl?'yes':'no'));
  L.push('eagle_uses_add='+egadd);
  return L.join('\n')+'\n';
}
function upd(){document.getElementById('out').value=gen();}
document.querySelectorAll('input').forEach(function(i){i.addEventListener('change',upd);});
function cp(){var t=document.getElementById('out');t.select();document.execCommand('copy');
  document.getElementById('msg').textContent='已复制 ✓';setTimeout(function(){document.getElementById('msg').textContent='';},1500);}
upd();
</script></body></html>
